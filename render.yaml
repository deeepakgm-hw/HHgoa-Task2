services:
  - type: web
    name: ragwave-voice-rag
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free # 100% Free tier (No credit card or payment info required)
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: SARVAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_GENERATION_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: DATASET_MODE
        value: real
      - key: CONFIDENCE_THRESHOLD
        value: "0.08"
